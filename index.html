<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earth</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; justify-content: center;
        align-items: center; background: #101418; color: #e8e4da;
        font: 18px/1.6 system-ui, sans-serif;
      }
      main { max-width: 560px; padding: 24px; text-align: center; }
      h1 { font-size: 28px; }
      button {
        font: inherit; padding: 12px 24px; margin: 8px; cursor: pointer;
        background: #2e4a3d; color: inherit; border: 1px solid #4a6a58; border-radius: 6px;
      }
      button:hover { background: #3a5c4c; }
      .seed { font-size: 13px; opacity: 0.6; word-break: break-all; }
      .card { margin: 24px 0; }
      main { text-align: left; }
      h1, h2 { text-align: center; }
      .meta { text-align: center; opacity: 0.8; }
      .scales { margin: 16px 0; }
      .scale-row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
      .scale-name { width: 110px; font-size: 14px; }
      .bar { flex: 1; height: 10px; background: #232a30; border-radius: 5px; overflow: hidden; }
      .fill { height: 100%; }
      .fill-health { background: #7aa87a; }
      .fill-money { background: #c2a25a; }
      .fill-education { background: #6a8ec2; }
      .fill-bonds { background: #c27a9a; }
      .event { border: 1px solid #33404a; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
      .choice { margin: 8px 0; }
      .choice button { width: 100%; text-align: left; margin: 0; }
      .btn-tradition { background: #5a4a2a; border-color: #c2a25a; }
      .btn-tradition:hover { background: #6a5a35; }
      .btn-change { background: #2a3a5a; border-color: #6a8ec2; }
      .btn-change:hover { background: #35466a; }
      .btn-bonds { background: #5a2a42; border-color: #c27a9a; }
      .btn-bonds:hover { background: #6a3550; }
      .btn-self { background: #422a5a; border-color: #9a7ac2; }
      .btn-self:hover { background: #50356a; }
      .arrows { font-size: 13px; opacity: 0.75; margin-left: 8px; }
      .risk { font-size: 13px; opacity: 0.85; margin-left: 8px; }
      .dots { display: inline-block; width: 110px; line-height: 0; vertical-align: middle; }
      .dots i { display: inline-block; width: 8px; height: 8px; margin: 1px; background: #3a454e; border-radius: 2px; }
      .dots i.on { background: #7aa87a; }
      .risk-detail { display: block; opacity: 0.7; }
      .outcome { font-size: 19px; }
      .chronicle { font-size: 15px; max-height: 300px; overflow-y: auto; }
      .scene { display: block; width: 100%; image-rendering: pixelated; border-radius: 8px; margin-bottom: 12px; }
      .axis { margin: 16px 0; }
      .axis-labels { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
      .axis-track { position: relative; height: 10px; background: #232a30; border-radius: 5px; }
      .axis-center { position: absolute; left: 50%; width: 2px; height: 100%; background: #4a5a66; }
      .axis-marker { position: absolute; top: -4px; width: 18px; height: 18px; background: #e8e4da; border-radius: 50%; transform: translateX(-50%); }
      .axis-note { text-align: center; font-size: 13px; opacity: 0.6; margin-top: 4px; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
